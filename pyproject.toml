[project]
name = "openclaw-long-tasks"
version = "0.1.0"
description = "Durable long-task orchestration prototype for OpenClaw"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
openclaw-long-tasks = "long_tasks.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/long_tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
