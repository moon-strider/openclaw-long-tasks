[project]
name = "openclaw-long-tasks"
version = "0.2.0"
description = "Durable long-task orchestration and MAKER microtasks for OpenClaw"
readme = "README.md"
license = "MIT"
authors = [{name = "moon-strider"}]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
  "mypy>=1.19,<3",
  "pip-audit>=2.10,<3",
]

[project.scripts]
openclaw-long-tasks = "long_tasks.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/long_tasks"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_e2e"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["long_tasks"]

[tool.coverage.report]
fail_under = 85
show_missing = true
